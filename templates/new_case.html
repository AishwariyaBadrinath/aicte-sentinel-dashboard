{% extends "base.html" %}{% block title %}Register Case{% endblock %}{% block page %}Register Case{% endblock %}{% block content %}<div class="heading"><div><small>CASE INTAKE</small><h1>Register a new case</h1><p>Enter basic details for routing and follow-up.</p></div><a href="/cases">← Case registry</a></div><form class="panel formgrid" method="post"><label class="wide">Institution name *<input name="institution" required></label><label>Bureau / cell<select name="bureau">{% for x in ['Regional Bureau - South','Regional Bureau - North','RB - East','RB - West','PGRC','Technical Education Cell','Legal Cell'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Region<select name="region">{% for x in ['South','North','East','West','Central'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Category<select name="category">{% for x in ['Infrastructure','Student Grievance','Compliance','Safety','Faculty','General'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Priority<select name="priority">{% for x in ['Low','Medium','High','Critical'] %}<option {% if x=='Medium' %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label class="wide">Case subject *<input name="subject" required></label><label class="wide">Description *<textarea name="description" rows="5" required></textarea></label><label>SLA target (days)<input name="sla" type="number" min="1" max="365" value="30"></label><div class="wide"><button class="button">Create case →</button></div></form>{% endblock %}
